# USB CDC-ACM debug console — new UDC stack (USB_DEVICE_STACK_NEXT)
# Required for RP2350: legacy USB_DEVICE_STACK does not work on rpi_pico2.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Auto-initialize USB device and CDC ACM at boot (no app code changes needed)
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_VID=0x2E8A
CONFIG_CDC_ACM_SERIAL_PID=0x000A
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Umbreon Debug"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Raspberry Pi"

# Line control support for CDC ACM UART
CONFIG_UART_LINE_CTRL=y

# Suppress USB stack noise in logs
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
