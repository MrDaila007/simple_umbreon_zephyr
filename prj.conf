# ─── Simple Umbreon Zephyr — Minimal Racing Configuration ─────────────────────

# I/O subsystems
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SENSOR=y

# VL53L0X enhanced out-of-tree driver (replaces stock)
CONFIG_VL53L0X=n
CONFIG_VL53L0X_ENHANCED=y
CONFIG_VL53L0X_ENHANCED_RECONFIGURE_ADDRESS=y

# NVS persistent settings
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Watchdog
CONFIG_WATCHDOG=y

# Console via USB CDC (legacy stack disabled; usb_console.conf enables _NEXT)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_PRINTK=y

# UF2 output for BOOTSEL flashing
CONFIG_BUILD_OUTPUT_UF2=y

# Kernel
CONFIG_POLL=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Float support in printf (needed for $RUN/$CFG telemetry)
CONFIG_PICOLIBC_IO_FLOAT=y
